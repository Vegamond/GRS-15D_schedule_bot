name: Daily Schedule Post

on:
  schedule:
    - cron: "30 5 * * *"   # 07:30 за Києвом взимку (UTC+2)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Post schedule
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GCAL_ICS_URL: ${{ secrets.GCAL_ICS_URL }}
        run: python calendar_bot.py
