name: Alerts - Dnipro

on:
  schedule:
    - cron: "*/2 * * * *"   # кожні 2 хв
  workflow_dispatch:

jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Poll alerts and post to Telegram topic
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_ALERTS_THREAD_ID: ${{ secrets.TG_ALERTS_THREAD_ID }}
          ALERTS_TOKEN: ${{ secrets.ALERTS_TOKEN }}
          ALERTS_UID: "332"
          ALERTS_STATE_FILE: "alerts_state.json"
        run: |
          python alert_bot.py

      - name: Commit alerts state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add alerts_state.json || true
          git commit -m "Update alerts state" || echo "No changes"
          git push || true
