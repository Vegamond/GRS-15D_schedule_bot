name: Alerts - Dnipro

on:
  workflow_dispatch:
  schedule:
    # кожну хвилину (можеш зробити раз на 30-60 секунд не можна — мінімум хвилина)
    - cron: "* * * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Poll alerts and post to Alerts thread
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_ALERTS_THREAD_ID: ${{ secrets.TG_ALERTS_THREAD_ID }}
          ALERTS_TOKEN: ${{ secrets.ALERTS_TOKEN }}
          ALERTS_UID: "332"
          # якщо твій endpoint інший — просто заміниш secrets/vars або тут:
          # ALERTS_ACTIVE_URL: "https://...."
        run: |
          python alert_bot.py

      - name: Commit alerts state
        run: |
          if [ -f alerts_state.json ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add alerts_state.json
            git commit -m "Update alerts state" || echo "No changes"
            git push || echo "No push"
          else
            echo "alerts_state.json not found, skipping commit"
          fi
