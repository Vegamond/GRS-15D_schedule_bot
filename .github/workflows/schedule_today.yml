name: Schedule - Today

on:
  schedule:
    # Часто вранці (UTC), щоб не проспати. Пост контролює код (після 08:00 Kyiv).
    - cron: "*/10 4-10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schedule-today
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Post schedule (today)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GCAL_ICS_URL: ${{ secrets.GCAL_ICS_URL }}
          MODE: "today"
        run: python calendar_bot.py

      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add state.json || true
          git commit -m "Update schedule state (today)" || true
          git pull --rebase || true
          git push || true
