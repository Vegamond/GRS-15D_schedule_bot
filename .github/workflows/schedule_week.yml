name: Schedule - Week

on:
  schedule:
    - cron: "0 16 * * 0" # Sunday 18:00 Kyiv (winter UTC+2)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Post schedule (week) to Schedule thread
        env:
          MODE: week
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_SCHEDULE_THREAD_ID: ${{ secrets.TG_SCHEDULE_THREAD_ID }}
          GCAL_ICS_URL: ${{ secrets.GCAL_ICS_URL }}
        run: python calendar_bot.py

      - name: Commit state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add state.json
          git commit -m "Update state (week)" || echo "No changes"
          git push
